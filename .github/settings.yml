# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter-ha
  description: Kamerplanter Custom Integration for Home Assistant
  homepage: https://nolte.github.io/kamerplanter-ha
  # A comma-separated string, never a YAML list: probot/settings calls .split() on
  # topics, and a list throws after the repository PATCH, which silently skips the
  # branches block (nolte/gh-plumbing#416).
  topics: home-assistant, hacs, custom-integration, kamerplanter, plant-management

# Labels this repository uses that the commons don't declare. probot/settings
# deletes every live label missing from the merged list (lib/plugins/diffable.js):
# `documentations` is on #2 and #5.
labels:
  - name: documentations
    color: "caa7e8"
    description: "Update documentation"
