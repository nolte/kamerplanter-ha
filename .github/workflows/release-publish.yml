name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must match an open release-drafter draft)."
        required: true
        type: string
      dry_run:
        description: "Validate every gate but do not flip draft -> published."
        required: false
        type: boolean
        default: false

# Thin caller for the canonical reusable in nolte/gh-plumbing. The reusable
# resolves the draft, verifies version-bearing-file alignment + the
# `chore(release): <tag>` commit, builds and attaches the HACS asset, then
# flips draft -> published. See spec/project/release-automation/ and
# spec/project/release-skill-layer/.
#
# When `vars.PORTFOLIO_APP_ID` is set, the reusable mints a short-lived
# GitHub-App installation token from `secrets.PORTFOLIO_APP_PRIVATE_KEY` and
# uses it for `gh release edit --draft=false`. App-authored release:published
# events cascade to release.yml / release-cd-refresh-master.yml /
# release-cd-deliver-docs.yml; GITHUB_TOKEN-authored ones don't (the cascade
# gap, spec/project/workflow-health/ §Known platform constraints).
#
# HACS asset note: the reusable builds a contents-at-root `<domain>.zip`, while
# hacs.json currently declares no `filename` (git-source installs). Reconciling
# the asset strategy and removing the now-redundant release.yml packaging job
# is tracked in #35.

jobs:
  publish:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@v1.1.24
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
