StylesPath = .github/styles
MinAlertLevel = suggestion

Packages = Microsoft, RedHat, https://github.com/nolte/vale-style/releases/download/v0.1.17/nolte-styles.zip

Vocab = kamerplanter, technical

IgnoredScopes = code, tt, em

[*.md]
BasedOnStyles = Vale, Microsoft
# Project style choices that diverge from Microsoft's general-audience guide and
# would otherwise produce noise on this technical Home Assistant documentation:
#   - Dashes: the docs use a consistent spaced em-dash ( — ) as a deliberate style.
#   - GeneralURL: "URL" is the correct, audience-appropriate term for HA setup.
#   - Headings: heading capitalization is a per-project choice here.
#   - Contractions: mandating contractions is a tone preference, not a defect.
Microsoft.Dashes = NO
Microsoft.GeneralURL = NO
Microsoft.Headings = NO
Microsoft.Contractions = NO
# Hyphenated "auto-" compounds (auto-registered, auto-selected) are the established
# spelling in the Home Assistant ecosystem; acronyms in headings (URL, API) are
# audience-appropriate here. Both Microsoft rules produce noise on this doc set.
Microsoft.Auto = NO
Microsoft.HeadingAcronyms = NO

# Non-English content stays out of Vale's scope (prose-style §Multilingual text).
# The German documentation tree is checked via LanguageTool, not Vale.
[docs/de/**]
BasedOnStyles =

[*.de.md]
BasedOnStyles =

# LLM-instruction artifact (CLAUDE.md peers), not end-user prose.
[CLAUDE.md]
BasedOnStyles =
